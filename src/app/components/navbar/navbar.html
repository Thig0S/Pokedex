<nav class="navbar navbar-expand-lg" style="background-color: #182033">
  <div class="container">
    <a class="navbar-brand fw-medium fs-3 fst-italic" href="#" fecharMenu()>Kowalski`s Pokedex</a>
    <button
      class="navbar-toggler"
      type="button"
      aria-controls="navbarNav"
      aria-label="Toggle navigation"
      [attr.aria-expanded]="menuAberto()"
      (click)="alterarMenu()"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="menuAberto()" id="navbarNav">
      <span class="ms-auto"></span>

      <ul class="navbar-nav">
        @for (item of itens; track $index) {
          <li class="nav-item">
            <a class="nav-link fs-6" aria-current="page"(click)="fecharMenu()" [href]="item.url">
              <i class="bi {{ item.icone }}"></i>
              {{ item.titulo }}
            </a>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
